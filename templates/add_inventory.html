{% extends "base.html" %}

{% block title %}
Add Stock Item - Hotel Billing
{% endblock %}

{% block content %}

<div style="max-width: 650px;">

    <h1>Add Stock Item</h1>

    <p style="color: #6b7280;">
        Add a new ingredient or stock item.
    </p>


    <div class="card" style="margin-top: 25px;">

        <form method="POST">


            <!-- ITEM NAME -->

            <div style="margin-bottom: 18px;">

                <label>
                    Item Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Example: Rice"
                    required
                    style="
                        width: 100%;
                        padding: 10px;
                        margin-top: 6px;
                        border: 1px solid #d1d5db;
                        border-radius: 6px;
                        box-sizing: border-box;
                    "
                >

            </div>


            <!-- UNIT -->

            <div style="margin-bottom: 18px;">

                <label>
                    Unit
                </label>

                <select
                    name="unit"
                    required
                    style="
                        width: 100%;
                        padding: 10px;
                        margin-top: 6px;
                        border: 1px solid #d1d5db;
                        border-radius: 6px;
                    "
                >

                    <option value="">
                        Select Unit
                    </option>

                    <option value="kg">
                        Kilogram (kg)
                    </option>

                    <option value="gram">
                        Gram (g)
                    </option>

                    <option value="litre">
                        Litre (L)
                    </option>

                    <option value="ml">
                        Millilitre (ml)
                    </option>

                    <option value="piece">
                        Piece
                    </option>

                    <option value="packet">
                        Packet
                    </option>

                    <option value="bottle">
                        Bottle
                    </option>

                    <option value="box">
                        Box
                    </option>

                </select>

            </div>


            <!-- CURRENT STOCK -->

            <div style="margin-bottom: 18px;">

                <label>
                    Current Stock
                </label>

                <input
                    type="number"
                    name="current_stock"
                    step="0.01"
                    min="0"
                    value="0"
                    required
                    style="
                        width: 100%;
                        padding: 10px;
                        margin-top: 6px;
                        border: 1px solid #d1d5db;
                        border-radius: 6px;
                        box-sizing: border-box;
                    "
                >

            </div>


            <!-- REORDER LEVEL -->

            <div style="margin-bottom: 18px;">

                <label>
                    Reorder Level
                </label>

                <input
                    type="number"
                    name="reorder_level"
                    step="0.01"
                    min="0"
                    value="0"
                    required
                    style="
                        width: 100%;
                        padding: 10px;
                        margin-top: 6px;
                        border: 1px solid #d1d5db;
                        border-radius: 6px;
                        box-sizing: border-box;
                    "
                >

                <small style="color: #6b7280;">
                    The manager will see a low-stock warning
                    when stock reaches this level.
                </small>

            </div>


            <!-- BUTTONS -->

            <div style="
                display: flex;
                gap: 10px;
                margin-top: 25px;
            ">

                <button
                    type="submit"
                    style="
                        background: #2563eb;
                        color: white;
                        border: none;
                        padding: 10px 18px;
                        border-radius: 6px;
                        cursor: pointer;
                    "
                >

                    Add Stock Item

                </button>


                <a
                    href="/inventory"
                    style="
                        background: #e5e7eb;
                        color: #111827;
                        padding: 10px 18px;
                        border-radius: 6px;
                        text-decoration: none;
                    "
                >

                    Cancel

                </a>

            </div>


        </form>

    </div>

</div>

{% endblock %}
