<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Hotel Billing</title>

</head>

<body>

    <h1>Hotel Billing Software</h1>

    <h2>Login</h2>

    <form method="POST">

        <label>Username</label>
        <br>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>

        <label>Password</label>
        <br>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

</body>

</html>
