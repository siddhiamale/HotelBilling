<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Payment - Order #{{ order.id }}
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 30px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f3f4f6;

            color: #111827;

        }


        .payment-container {

            max-width: 550px;

            margin: 50px auto;

        }


        .payment-card {

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.08);

        }


        h1 {

            margin-top: 0;

            text-align: center;

        }


        .order-info {

            background: #f9fafb;

            padding: 18px;

            border-radius: 8px;

            margin:
                20px 0;

        }


        .info-row {

            display: flex;

            justify-content:
                space-between;

            padding: 7px 0;

        }


        .amount {

            font-size: 24px;

            font-weight: bold;

            color: #16a34a;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;

        }


        select {

            width: 100%;

            padding: 12px;

            border:
                1px solid #d1d5db;

            border-radius: 6px;

            font-size: 15px;

            background: white;

        }


        .pay-btn {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            background: #16a34a;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;

        }


        .pay-btn:hover {

            background: #15803d;

        }


        .back-btn {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #374151;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="payment-container">


    <div class="payment-card">


        <h1>
            Payment
        </h1>


        <div class="order-info">


            <div class="info-row">

                <span>
                    Order ID
                </span>

                <strong>
                    #{{ order.id }}
                </strong>

            </div>


            <div class="info-row">

                <span>
                    Order Type
                </span>

                <strong>
                    {{ order.order_type }}
                </strong>

            </div>


            <div class="info-row">

                <span>
                    Total Amount
                </span>

                <strong class="amount">

                    ₹{{ "%.2f"|format(order.grand_total) }}

                </strong>

            </div>


            <div class="info-row">

                <span>
                    Current Status
                </span>

                <strong>
                    {{ order.payment_status }}
                </strong>

            </div>


        </div>


        <form
            method="POST"
        >


            <label
                for="payment_method"
            >

                Payment Method

            </label>


            <select
                name="payment_method"
                id="payment_method"
                required
            >

                <option value="">
                    Select Payment Method
                </option>


                <option value="Cash">
                    💵 Cash
                </option>


                <option value="UPI">
                    📱 UPI
                </option>


                <option value="Card">
                    💳 Card
                </option>

            </select>


            <button
                type="submit"
                class="pay-btn"
            >

                ✓ Mark as Paid

            </button>


        </form>


        <a
            href="/orders/{{ order.id }}/bill"
            class="back-btn"
        >

            ← Back to Bill

        </a>


    </div>


</div>


</body>

</html>
