{% extends "base.html" %}

{% block title %}
Edit Dish - Hotel Billing
{% endblock %}

{% block content %}

<h1>Edit Dish</h1>

<p style="margin-top: 5px; color: #6b7280;">
    Update menu item information
</p>


<div class="card" style="margin-top: 25px; max-width: 650px;">

    <form method="POST">

        <!-- Dish Name -->

        <div style="margin-bottom: 20px;">

            <label>Dish Name</label>

            <input
                type="text"
                name="name"
                value="{{ dish.name }}"
                required
                style="
                    width: 100%;
                    padding: 12px;
                    margin-top: 8px;
                    border: 1px solid #d1d5db;
                    border-radius: 6px;
                "
            >

        </div>


        <!-- Description -->

        <div style="margin-bottom: 20px;">

            <label>Description</label>

            <textarea
                name="description"
                rows="4"
                style="
                    width: 100%;
                    padding: 12px;
                    margin-top: 8px;
                    border: 1px solid #d1d5db;
                    border-radius: 6px;
                    resize: vertical;
                "
            >{{ dish.description or "" }}</textarea>

        </div>


        <!-- Category -->

        <div style="margin-bottom: 20px;">

            <label>Category</label>

            <select
                name="category_id"
                required
                style="
                    width: 100%;
                    padding: 12px;
                    margin-top: 8px;
                    border: 1px solid #d1d5db;
                    border-radius: 6px;
                    background: white;
                "
            >

                {% for category in categories %}

                    <option
                        value="{{ category.id }}"
                        {% if category.id == dish.category_id %}
                            selected
                        {% endif %}
                    >
                        {{ category.name }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- Price -->

        <div style="margin-bottom: 20px;">

            <label>Price (₹)</label>

            <input
                type="number"
                name="price"
                value="{{ dish.price }}"
                min="0"
                step="0.01"
                required
                style="
                    width: 100%;
                    padding: 12px;
                    margin-top: 8px;
                    border: 1px solid #d1d5db;
                    border-radius: 6px;
                "
            >

        </div>


        <!-- Available -->

        <div style="margin-bottom: 20px;">

            <label>

                <input
                    type="checkbox"
                    name="available"
                    {% if dish.available %}
                        checked
                    {% endif %}
                >

                Available for sale

            </label>

        </div>


        <!-- Buttons -->

        <button
            type="submit"
            style="
                background: #2563eb;
                color: white;
                border: none;
                padding: 11px 20px;
                border-radius: 6px;
                cursor: pointer;
            "
        >
            Update Dish
        </button>


        <a
            href="/dishes"
            style="
                margin-left: 10px;
                text-decoration: none;
                color: #374151;
            "
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
