<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Hotel Billing{% endblock %}</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */

        .sidebar {
            width: 240px;
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background: #374151;
            color: white;
        }

        /* Main */

        .main {
            flex: 1;
        }

        .topbar {
            height: 65px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid #ddd;
        }

        .content {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #6b7280;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            🏨 Hotel Billing
        </div>

        <a href="/dashboard">Dashboard</a>

        <a href="/orders">Orders</a>

        <a href="/orders">Bills</a>

        <a href="/orders">Payments</a>


        {% if session.get("role") in ["admin", "manager"] %}
        <a href="/categories">Categories</a>

        <a href="/dishes">Dishes</a>

        <a href="/inventory">Inventory</a>

        <a href="/sales">Sales</a>

        <a href="/best-selling">Best Selling</a>

        <a href="/monthly_sales">Monthly Sales</a>
        {% endif %}
      

        <br>

        <a href="/logout">Logout</a>

    </aside>


    <!-- Main Content -->

    <main class="main">

        <header class="topbar">

            <h3>
                Hotel Management System
            </h3>

            <div>
                {{ session.get("username", "User") }}
            </div>

        </header>


        <section class="content">

            {% block content %}

            {% endblock %}

        </section>

    </main>

</div>

</body>

</html>
